name: 台股盤後日報

on:
  schedule:
    # 週一至週五 13:30 UTC = 台北時間 21:30（融資融券約於晚間公布）
    # GitHub 排程在尖峰時段可能延遲數十分鐘
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "報告日期（YYYY-MM-DD，留空為今天）"
        required: false
      dry_run:
        description: "只產生 HTML，不寄信"
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝中文字型（趨勢圖用）
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: 產生並寄送報告
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          args=()
          [ -n "${{ inputs.date }}" ] && args+=(--date "${{ inputs.date }}")
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          python -m report "${args[@]}"

      - name: 上傳 HTML 報告
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: output/
